[package]
name = "polyspec-http-cookies"
version = "0.0.0"
edition = "2021"
rust-version = "1.97.0"
description = "The Cookie field of a request read into an ordered map, and one form of the Set-Cookie field"
repository = "https://github.com/polyspec/http-cookies.git"
publish = false
# The package holds the interface contract of the bindings beside the source, so that a repository that depends on
# this crate reads the contract from the package that Cargo resolved (bindgen design I-1, T-3).
include = ["/src/**/*.rs", "/interface.json"]

[lib]
name = "polyspec_http_cookies"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
proptest = "1.12.0"
serde_json = "1.0.154"

# The crate is its own workspace. Every warning fails, no unsafe code, no unwrap or expect, no discarded result, and
# every allow attribute names its rule; clippy.toml of the repository root disallows the methods that turn an Err or a
# None into a value.
[lints]
workspace = true

[workspace]

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
as_conversions = "deny"
