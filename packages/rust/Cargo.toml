[package]
name = "polyspec-http-cookies"
version = "0.0.0"
edition = "2021"
rust-version = "1.99.0"
description = "The Cookie field of a request read into an ordered map, and one form of the Set-Cookie field"
repository = "https://github.com/polyspec/http-cookies.git"
publish = false
# The package holds the interface contract of the bindings beside the source, so that a repository that depends on
# this crate reads the contract from the package that Cargo resolved (bindgen design I-1, T-3).
include = ["/src/**/*.rs", "/interface.json"]

[lib]
name = "polyspec_http_cookies"
path = "src/lib.rs"

[dependencies]
polyspec-bindgen-core = { git = "https://github.com/polyspec/bindgen.git", branch = "v1/rust-core" }

[dev-dependencies]
proptest = "1.12.0"
serde_json = "1.0.154"

# The lints are those of the workspace at the repository root.
[lints]
workspace = true
